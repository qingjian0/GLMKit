name: build-apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "APK version label (informational)"
        required: false
        default: "v2.0.6"
  push:
    branches: [ main ]
    paths:
      - "module/**"
      - "scripts/**"
      - "third_party/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "SDK=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools"
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Build (javac + d8 + aapt2 + zipalign + apksigner)
        run: |
          bash module/build.sh
          ls -l module/*.apk
          sha256sum module/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glmkit-apk
          path: |
            module/glmkit-*.apk
            module/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: module/glmkit-*.apk
          fail_on_unmatched_files: false

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: glmkit-apk
          path: out
      - name: Sanity check APK
        run: |
          set -e
          APK=$(ls out/*.apk | head -n1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'classes.dex|META-INF/xposed/module.prop|lib/arm64-v8a/libcloudflared.so'
          unzip -p "$APK" META-INF/xposed/module.prop
