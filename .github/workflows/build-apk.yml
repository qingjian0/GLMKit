name: build-apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "APK version label (informational)"
        required: false
        default: "v2.0.6"
  push:
    branches: [ main ]
    paths:
      - "module/**"
      - "scripts/**"
      - "third_party/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (platforms;android-35 + build-tools;35.0.0)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o "$RUNNER_TEMP/clt.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/clt.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$SDK/platforms" "$SDK/build-tools"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$SDK/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: Build (javac + d8 + aapt2 + zipalign + apksigner)
        run: |
          set -euo pipefail
          which java javac aapt2 d8 zipalign apksigner
          bash module/build.sh
          ls -l module/*.apk
          sha256sum module/*.apk | tee /tmp/apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glmkit-apk
          path: module/glmkit-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: module/glmkit-*.apk
          fail_on_unmatched_files: false

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: glmkit-apk
          path: out
      - name: Sanity check APK
        run: |
          set -euo pipefail
          APK=$(ls out/*.apk | head -n1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'classes.dex|META-INF/xposed/module.prop|lib/arm64-v8a/libcloudflared.so'
          echo '--- module.prop ---'
          unzip -p "$APK" META-INF/xposed/module.prop
